<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanaluokittelija – Sanasankarit!</title>
  <meta name="description" content="Lajittele sanat oikeisiin ryhmiin – suomen kielen sanastoharjoitus.">
  <link rel="stylesheet" href="../CSS/tyyli.css">
  <link rel="stylesheet" href="../CSS/joonas.css">
</head>
<body>

  
  <div class="page-wrapper">
    <header class="header">
      <div class="header-inner">
        <a href="../HTML/index.html" class="logo">

          <img src="" alt="Logo">
        </a>
        <nav class="nav">
          <a href="../HTML/index.html" class="nav-link">Etusivu</a>
          <a href="../HTML/info.html" class="nav-link">Info</a>
          <a href="../HTML/pisteet.html" class="nav-link">Pisteet</a>
          <div class="dropdown">
            <a href="../HTML/pelit.html" class="dropdown-toggle">
              Pelit
              <!-- Arrow icon using SVG -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="dropdown-arrow">
  <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
</svg>
            </a>
            <div class="dropdown-menu">
              <a href="../Pelit/Thanakan.html" class="dropdown-item">Sanaseikkailu</a>
              <a href="../Pelit/Annika.html" class="dropdown-item">Yhdistä sana kuvaan</a>
              <a href="../Pelit/Emilia.html" class="dropdown-item">Sanaluokkapeli</a>
              <a href="../Pelit/Anastasiia.html" class="dropdown-item">Sanaristikko</a>
              <a href="../Pelit/Kristiina.html" class="dropdown-item">Numero muistipeli</a>
              <a href="../Pelit/Joonas.html" class="dropdown-item">Lajittele sanat</a>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main class="main-content game-main">
      <div class="game-container" id="game-container">
        <div class="game-header">
          <h1 class="game-title">Sanaluokittelija</h1>
          <p class="game-subtitle">Vedä sanat oikeaan ryhmään!</p>
        </div>

        <div class="result-panel" id="result-panel" aria-live="polite">
          <p class="result-score" id="result-score"></p>
          <p class="result-message" id="result-message"></p>
          <button class="restart-btn" id="restart-btn" onclick="startGame()">Pelaa uudestaan</button>
        </div>

        <div class="drop-zones" id="drop-zones">
        </div>

        <div class="word-pool" id="word-pool">
        </div>

        <div class="check-row">
          <button class="check-btn" id="check-btn" disabled onclick="checkAnswers()">Tarkista</button>
        </div>


      </div>

    </main>

    <footer class="footer">
      <p>TIK25SP Web-projekti</p>
    </footer>

  </div>

  <script src="../JS/joonas.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      const dropdownToggle = document.querySelector('.dropdown-toggle');
      const dropdown = document.querySelector('.dropdown');

      dropdownToggle.addEventListener('click', function(e) {
        dropdown.classList.toggle('show');
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  </script>

</body>
</html>
