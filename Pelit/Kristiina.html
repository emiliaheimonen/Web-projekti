<html lang="fi">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="header-inner">
                <a href="../HTML/index.html" class="logo">
                    <img src="../Kuvat/logo.png" alt="logo">
                </a>
                <nav class="nav">
                    <a href="../HTML/index.html" class="nav-link">Etusivu</a>
                    <a href="../HTML/info.html" class="nav-link">Info</a>
                    <a href="../HTML/pisteet.html" class="nav-link">Pisteet</a>
                    <div class="dropdown">
                        <a href="../HTML/pelit.html" class="dropdown-toggle">
                            Pelit
                        </a>
                        <div class="dropdown-menu">
                            <a href="../Pelit/Thanakan.html" class="dropdown-item">Sanaseikkailu</a>
                            <a href="../Pelit/Annika.html" class="dropdown-item">Yhdistä sana kuvaan</a>
                            <a href="../Pelit/Emilia.html" class="dropdown-item">Sanaluokkapeli</a>
                            <a href="../Pelit/Anastasiia.html" class="dropdown-item">Sanaristikko</a>

                            <a href="../Pelit/Joonas.html" class="dropdown-item">Lajittele sanat</a>
                        </div>
                    </div>
                </nav>
            </div>
        </header>
        <main class="main-home">
            <div class="home-content">
                <div class="home-text">
                    <h1 class="home-title">
                        Numero muistipeli!
                    </h1>
                    <p class="home-description">
                        Harjoita numeroiden oppimista helpolla, kivalla muistipelillä.
                        Löydä numeroille 1 - 10 vastakohta englanniksi tai suomeksi.
                    </p>
                    <div class="game-layout">
                        <button onclick="restart()">Aloita uudelleen</button>
                        <div class="game-area">
                            <div class="grid-container"></div>
                        </div>
                        <div class="game-info">
                            <p class="score-text">Pisteet: <span class="score"></span></p>
                            <div id="result-panel" class="result-panel">
                                <p id="result-message"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <p>TIK25SP Web-projekti</p>
        </footer>
    </div>
<script src="../JS/Numeromuistipeli.js"></script>


<script>
setInterval(() => {
  const element = document.querySelector(".score");
  const text = element?.textContent;

  const number = parseInt(text?.replace(/\D/g, ""));

  if (!isNaN(number)) {
    localStorage.setItem("muistipeliScore", number);
  }
}, 500);
</script>
    
</body>
