<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanasankarit!</title>
  <link rel="stylesheet" href="../CSS/tyyli.css">
  <link rel="stylesheet" href="../CSS/Kristiinan.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="header-inner">
        <a href="../index.html" class="logo">
          <img src="../Kuvat/logo.png" alt="Logo">
        </a>

        <nav class="nav">
          <a href="../index.html" class="nav-link">Etusivu</a>
          <a href="../HTML/info.html" class="nav-link">Info</a>
          <a href="../HTML/pisteet.html" class="nav-link">Pisteet</a>

          <div class="dropdown">
            <a href="../HTML/pelit.html" class="dropdown-toggle">
              Pelit
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="dropdown-arrow">
                <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
              </svg>
            </a>

            <div class="dropdown-menu">
              <a href="../Pelit/Thanakan.html" class="dropdown-item">Sanaseikkailu</a>
              <a href="../Pelit/Annika.html" class="dropdown-item">Yhdistä sana kuvaan</a>
              <a href="../Pelit/Emilia.html" class="dropdown-item">Sanaluokkapeli</a>
              <a href="../Pelit/Anastasiia.html" class="dropdown-item">Sanaristikko</a>
              <a href="../Pelit/Kristiina.html" class="dropdown-item">Numero muistipeli</a>
              <a href="../Pelit/Joonas.html" class="dropdown-item">Lajittele sanat</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

        <main class="main-home">
            <div class="home-content">
                <div class="home-text">
                    <h1 class="home-title">
                        Numero muistipeli!
                    </h1>
                    <p class="home-description">
                        Harjoita numeroiden oppimista helpolla, kivalla muistipelillä.
                        Yhdistä sama numero suomeksi ja englanniksi!
                    </p>
                    <div class="level-select">
                      <label for="difficulty">Valitse taso:</label>
                      <select id="difficulty" onchange="startGame()">
                        <option value="easy">Helppo (1 - 4)</option>
                        <option value="medium">Keskivaikea (5 - 9)</option>
                        <option value="hard" selected>Vaikea (1 - 10)</option>
                      </select>
                    </div>
                    <div class="game-layout">
                        <button onclick="restart()">Aloita uudelleen</button>
                        <div class="game-area">
                            <div class="grid-container"></div>
                        </div>
                        <div class="game-info">
                            <p class="score-text">Pisteet: <span class="score"></span></p>
                            <div id="result-panel" class="result-panel">
                                <p id="result-message"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <p>TIK25SP Web-projekti</p>
        </footer>
    </div>
<script src="../JS/Numeromuistipeli.js"></script>


<script>
setInterval(() => {
  const element = document.querySelector(".score");
  const text = element?.textContent;

  const number = parseInt(text?.replace(/\D/g, ""));

  if (!isNaN(number)) {
    localStorage.setItem("muistipeliScore", number);
  }
}, 500);
</script>
    
</body>
</html>
